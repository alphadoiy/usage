name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Check version tag
        shell: bash
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]]
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ env.TARGET }}
          save-if: false
      - name: Build and package
        shell: bash
        run: |
          cargo +stable build --release --locked --target "$TARGET"
          "target/$TARGET/release/usage" --help
          mkdir -p dist
          tar -czf "dist/usage-${GITHUB_REF_NAME}-${TARGET}.tar.gz" -C "target/$TARGET/release" usage
      - uses: actions/upload-artifact@v4
        with:
          name: usage-${{ env.TARGET }}
          path: dist/*.tar.gz
          if-no-files-found: error
  # Tests run once, in CI, for this exact commit. Building in parallel with that
  # run keeps the release as fast as the slower of the two.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deadline=$((SECONDS + 1500))
          while true; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion)"
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "CI did not succeed for $GITHUB_SHA" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "No successful CI run for $GITHUB_SHA; push the commit to main first." >&2
              exit 1
            fi
            sleep 15
          done
  publish:
    needs: [build, verify-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: usage-*
          path: dist
          merge-multiple: true
      - name: Generate formula and checksums
        run: |
          python3 scripts/release-formula.py --repo "$GITHUB_REPOSITORY"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/usage.rb dist/SHA256SUMS --verify-tag --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false
