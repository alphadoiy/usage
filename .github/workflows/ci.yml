name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      USAGE_LOG: "off"
      USAGE_CODEX_DIR: /tmp/usage-ci/accounts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --locked
      - name: TUI workflow contracts
        run: python3 tests/support/ui_workflows.py target/debug/usage
      - name: Install pinned native Codex for contract tests
        run: npm install --prefix "$RUNNER_TEMP/usage-native-codex" --no-audit --no-fund @openai/codex@0.166.0
      - name: Native Codex context and shared-session contracts
        run: |
          python3 tests/support/native_codex_context.py target/debug/usage "$RUNNER_TEMP/usage-native-codex/node_modules/.bin/codex"
          python3 tests/support/magpie.py target/debug/usage "$RUNNER_TEMP/usage-native-codex/node_modules/.bin/codex"
      - name: Experiment runner tests
        run: python3 -m unittest discover -s scripts/ablation -p 'test_*.py'
      - name: Ablation anchors
        run: |
          python3 scripts/ablate-provider-stage1.py --output /private/tmp/usage-ci-provider-anchors --check-anchors
          python3 scripts/ablate-run-bindings.py --output /private/tmp/usage-ci-run-anchors --check-anchors
          python3 scripts/ablate-current-changes.py --output /private/tmp/usage-ci-current-anchors --check-anchors

  release-cache:
    # Tag caches are isolated from other tags, so warm the release dependencies
    # on main. Tests are cached by the check job and no longer run at release time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-aarch64-apple-darwin
      - name: Compile release dependencies
        run: cargo +stable build --release --locked --target aarch64-apple-darwin
