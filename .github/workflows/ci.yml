name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      USAGE_LOG: "off"
      USAGE_CODEX_DIR: /tmp/usage-ci/accounts
      USAGE_PLUGIN_DIR: /tmp/usage-ci/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --locked -- --test-threads=1
      - name: Plugin protocol and action tests
        run: node --test src/plugins/protocol.test.mjs src/plugins/actions.test.mjs src/plugins/trae_actions.test.mjs
      - name: Experiment runner tests
        run: python3 -m unittest discover -s scripts/ablation -p 'test_*.py'
      - name: Ablation anchors
        run: |
          python3 scripts/ablate-provider-stage1.py --output /private/tmp/usage-ci-provider-anchors --check-anchors
          python3 scripts/ablate-run-bindings.py --output /private/tmp/usage-ci-run-anchors --check-anchors

  release-cache:
    # Tag caches are isolated from other tags. Warm both native targets on main
    # so future releases can restore debug and release dependencies from it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Compile test dependencies
        run: cargo +stable test --locked --no-run
      - name: Compile release dependencies
        run: cargo +stable build --release --locked --target ${{ matrix.target }}
