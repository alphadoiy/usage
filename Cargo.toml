[package]
name = "usage"
version = "0.1.2"
edition = "2024"
description = "在终端里查看 Claude Code、Codex 和 Grok 的官方用量"
publish = false

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
flate2 = "1"
ratatui = "0.30"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "json", "rustls-tls", "stream", "blocking"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
semver = "1"
sha2 = "0.10"
shlex = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util", "io-std", "process"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt", "json", "env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
ruzstd = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
