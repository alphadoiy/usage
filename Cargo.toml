[package]
name = "usage"
version = "0.1.0"
edition = "2024"
description = "在终端里查看 Claude Code、Codex 和 Grok 的官方用量"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["charset", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
